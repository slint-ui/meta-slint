# Recipes only the demo images need, kept out of meta-slint itself so that
# projects using meta-slint don't pick them up. The demo-image build scripts
# add this layer (see slint_demo_configure_local_conf in ../common.sh).
BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "slint-demo-images"
BBFILE_PATTERN_slint-demo-images = "^${LAYERDIR}/"
BBFILE_PRIORITY_slint-demo-images = "6"

LAYERDEPENDS_slint-demo-images = "core"
LAYERSERIES_COMPAT_slint-demo-images = "kirkstone langdale mickledore nanbield scarthgap styhead walnascar whinlatter wrynose"
